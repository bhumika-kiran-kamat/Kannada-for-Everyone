<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn everyday Kannada words with friendly interactive flashcards."
    />
    <title>Kannada Flashcards | Kannada for Everyone</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body
    class="relative isolate min-h-screen overflow-x-hidden bg-[#fffaf1] font-['Avenir_Next',Avenir,'Segoe_UI',sans-serif] text-[#23485c] antialiased"
  >
    <div
      class="pointer-events-none fixed inset-0 -z-10 overflow-hidden"
      aria-hidden="true"
    >
      <div
        class="absolute -left-24 -top-28 size-80 rounded-full bg-[#f6d9ae]/40 blur-3xl"
      ></div>
      <div
        class="absolute -bottom-32 -right-20 size-96 rounded-full bg-[#b8d8c8]/45 blur-3xl"
      ></div>
      <svg
        class="absolute inset-0 h-full w-full text-[#bb8952]/20"
        viewBox="0 0 1440 900"
        fill="none"
        preserveAspectRatio="xMidYMid slice"
      >
        <g
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <g transform="translate(100 190) rotate(-8)">
            <path d="M0 8c25-11 50-10 75 2v78C50 75 25 74 0 85V8Z" />
            <path d="M75 10c25-12 50-13 75-2v77c-25-11-50-10-75 2V10Z" />
            <path
              d="M75 10v77M14 29c17-5 34-4 48 2M14 46c17-5 34-4 48 2M88 29c17-5 34-4 48-2M88 46c17-5 34-4 48-2"
            />
          </g>
          <path
            d="M1210 630h116a12 12 0 0 1 12 12v58a12 12 0 0 1-12 12h-54l-25 22v-22h-37a12 12 0 0 1-12-12v-58a12 12 0 0 1 12-12Z"
          />
          <path
            d="m1164 190 5 15 15 5-15 5-5 15-5-15-15-5 15-5 5-15ZM320 660l4 11 11 4-11 4-4 11-4-11-11-4 11-4 4-11Z"
          />
          <circle cx="1080" cy="270" r="5" />
          <circle cx="250" cy="550" r="4" />
        </g>
        <text
          x="1268"
          y="690"
          text-anchor="middle"
          fill="currentColor"
          font-size="36"
          font-weight="700"
        >
          ಅ
        </text>
      </svg>
    </div>

    <main
      class="mx-auto flex min-h-screen w-full max-w-[1120px] flex-col px-4 py-5 sm:px-6 sm:py-8 lg:px-10"
    >
      <header
        class="flex flex-wrap items-center justify-between gap-x-4 gap-y-3"
      >
        <a
          class="inline-flex items-center gap-[9px] text-[0.9rem] font-[650] text-[#61716e] no-underline transition-[color,transform] duration-[160ms] hover:-translate-x-0.5 hover:text-[#ba7130] focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-[#1762a0]"
          href="choose.html"
        >
          <span class="text-[1.2rem]" aria-hidden="true">←</span>
          <span>📝Back to choices</span>
        </a>
        <a
          class="inline-flex items-center gap-2 text-sm font-bold tracking-[-0.02em] text-[#42645f] no-underline transition-colors hover:text-[#d77d35] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#1762a0] sm:text-base"
          href="index.html"
        >
          <span
            class="grid size-9 place-items-center rounded-xl bg-white/80 text-[#d9823b] shadow-sm"
            aria-hidden="true"
          >
            <svg class="size-5" viewBox="0 0 24 24" fill="none">
              <path
                d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M8 7h8M8 11h6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span>Kannada for Everyone</span>
        </a>
        <span
          class="rounded-full border border-[#e5e9dc] bg-white/75 px-3 py-1.5 text-xs font-bold text-[#72817a] sm:px-4 sm:text-sm"
          >DAILY PRACTICE</span
        >
      </header>

      <section
        class="mx-auto flex w-full max-w-[680px] flex-1 flex-col justify-center py-8 sm:py-12"
        aria-labelledby="page-title"
      >
        <div class="mb-7 text-center sm:mb-9">
          <p
            class="mb-2 text-[0.68rem] font-extrabold tracking-[0.2em] text-[#c17a36] sm:text-xs"
          >
            A LITTLE PRACTICE GOES A LONG WAY
          </p>

          <p class="mb-0 mt-2 text-sm text-[#73827f] sm:text-base">
            One new word at a time. You’ve got this!
          </p>
        </div>

        <div class="mb-3 flex items-center justify-between gap-4">
          <span
            class="text-xs font-extrabold tracking-[0.12em] text-[#72817b] sm:text-sm"
            >YOUR PROGRESS</span
          >
          
          <span
            class="text-[0.72rem] font-extrabold tracking-[0.11em] text-[#87928c]"
            >QUESTION <strong class="ml-[5px] text-[#335b61]" id="num"></strong>
            <span class="font-semibold text-[#a1aaa3]">/30</span></span
          >
        </div>

        <article
          class="relative rounded-[26px] border border-white/90 bg-white/90 px-5 py-8 text-center shadow-[0_24px_70px_rgba(92,90,66,0.12),0_4px_14px_rgba(92,90,66,0.05)] backdrop-blur sm:rounded-[32px] sm:px-10 sm:py-12"
        >
          <span
            class="absolute left-5 top-5 inline-flex items-center gap-1.5 rounded-full bg-[#eef6ed] px-3 py-1.5 text-[0.68rem] font-bold text-[#56836a] sm:left-7 sm:top-7 sm:text-xs"
            id="heading"
          >
            <svg
              class="size-3.5"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M10 2v16M2 10h16M4.34 4.34l11.32 11.32m0-11.32L4.34 15.66"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </span>

          <div
            class="mx-auto mb-6 mt-8 grid size-[58px] place-items-center rounded-2xl bg-[#fff3df] text-[#dc8a3f] sm:mb-7 sm:size-16"
          >
            <svg
              class="size-7 sm:size-8"
              viewBox="0 0 32 32"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M6 8.5c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2v16c0 1.1-.9 2-2 2H8c-1.1 0-2-.9-2-2v-16Z"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M11 12h10M11 17h10M11 22h6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>

          <p
            class="mb-2 text-xs font-extrabold tracking-[0.18em] text-[#a1a99f] sm:text-sm"
          >
            IN KANNADA
          </p>
          <h2
            lang="kn"
            class="m-0 break-words font-['Noto_Sans_Kannada','Nirmala_UI',sans-serif] text-[clamp(2.6rem,12vw,4.75rem)] font-extrabold leading-[1.35] tracking-normal text-[#1762a0]"
            id="kannada"
          ></h2>
          <div class="mx-auto my-6 h-px w-16 bg-[#e9e7dc] sm:my-7"></div>
          <p
            class="mb-1 text-[clamp(1.45rem,6vw,2rem)] font-bold tracking-[-0.035em] text-[#2f535d]"
            id="english"
          ></p>
          <div
            class="flex flex-wrap items-center justify-center gap-x-2 gap-y-2"
          >
            <p class="m-0 text-sm text-[#84918c] sm:text-base">
              Pronunciation:
              <span
                class="font-semibold italic text-[#667b77]"
                id="pronounciation"
              ></span>
            </p>
          </div>
        </article>

        <nav
          class="mt-6 flex items-center justify-between gap-3 sm:mt-8"
          aria-label="Flashcard navigation"
        >
          <button
            type="button"
            class="inline-flex min-h-12 flex-1 items-center justify-center gap-2 rounded-2xl bg-[#df8a3e] px-4 text-sm font-bold text-white shadow-[0_6px_16px_rgba(172,102,43,0.2)] transition-[transform,background-color,box-shadow] duration-150 hover:-translate-y-0.5 hover:bg-[#cf7832] hover:shadow-lg focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-[#1762a0] active:translate-y-0 sm:flex-none sm:min-w-36 sm:text-base"
            aria-label="Previous flashcard"
            id="preBtn"
          >
            <span aria-hidden="true">←</span>
            Previous
          </button>
          <button
            type="button"
            class="inline-flex min-h-12 flex-1 items-center justify-center gap-2 rounded-2xl bg-[#df8a3e] px-4 text-sm font-bold text-white shadow-[0_6px_16px_rgba(172,102,43,0.2)] transition-[transform,background-color,box-shadow] duration-150 hover:-translate-y-0.5 hover:bg-[#cf7832] hover:shadow-lg focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-[#1762a0] active:translate-y-0 sm:flex-none sm:min-w-36 sm:text-base"
            id="nextBtn"
          >
            Next
            <span aria-hidden="true">→</span>
          </button>
        </nav>
      </section>

      <footer class="pb-2 text-center text-xs text-[#95a098] sm:text-sm">
        Keep learning, one little win at a time
        <span class="text-[#d99b4d]" aria-hidden="true">✦</span>
      </footer>
    </main>
    <script src="flashcard.js"></script>
  </body>
</html>
